[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-drift-alert-migrator"
version = "0.1.0"
description = "Compares live database/JSON schemas against expected contracts to generate forward migration DDL and breaking-change alerts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
schema-drift-alert-migrator = "schema_drift_alert_migrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["schema_drift_alert_migrator*"]
